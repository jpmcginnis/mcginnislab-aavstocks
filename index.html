<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>McGinnis Lab — AAV Stocks</title>
<style>
  :root {
    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --soft: #9a9a9a;
    --bg: #ffffff;
    --panel: #fafafa;
    --border: #e4e4e4;
    --accent: #2a6df4;
    --accent-soft: #e8f0ff;
    --ok-bg: #e6f4ea;
    --ok-fg: #1e6b36;
    --warn-bg: #fff3cd;
    --warn-fg: #664d03;
    --dim-bg: #f0f0f0;
    --dim-fg: #777;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.4;
    font-size: 14px;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px 12px;
    z-index: 10;
  }
  header .row1 {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #sync-status {
    margin-left: auto;
    font-size: 11px;
    color: var(--soft);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #search {
    flex: 1;
    min-width: 240px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  select, .filter-pill {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--bg);
    font-family: inherit;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }
  #count {
    font-size: 12px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  main { padding: 16px 24px 60px; }
  .location-group { margin-bottom: 28px; }
  .location-group h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .location-group h2 .count {
    font-weight: 400;
    color: var(--soft);
    text-transform: none;
    letter-spacing: 0;
    font-size: 11px;
    margin-left: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:hover td { background: #fafbff; }
  .pos {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
  }
  .virus {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--fg);
    word-break: break-word;
    max-width: 340px;
  }
  .capsid {
    display: inline-block;
    padding: 2px 7px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .batch {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    white-space: nowrap;
  }
  .batch .titer { color: var(--fg); font-weight: 500; }
  .batch .vol { color: var(--muted); }
  .batch .marker {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: lowercase;
    letter-spacing: 0.02em;
  }
  .marker.red    { background: #fde0e0; color: #a01818; }
  .marker.blue   { background: #dde6f6; color: #184799; }
  .marker.green  { background: #d9ecd9; color: #1a6b1a; }
  .marker.black  { background: #d6d6d6; color: #1a1a1a; }
  .marker.orange { background: #ffe4c4; color: #a65a00; }
  .marker.purple { background: #e5d9f2; color: #5e2b8e; }
  .marker.yellow { background: #fff2b8; color: #8a6d00; }
  .marker.gray, .marker.generic { background: #e4e4e4; color: #555; }
  .status {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .status.available { background: var(--ok-bg); color: var(--ok-fg); }
  .status.empty     { background: var(--dim-bg); color: var(--dim-fg); }
  .status.no-virus  { background: var(--warn-bg); color: var(--warn-fg); }
  .deposit { font-size: 11px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
  .edit-link {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    opacity: 0.6;
  }
  tr:hover .edit-link { opacity: 1; }
  .edit-link:hover { text-decoration: underline; }
  tr.row-empty td, tr.row-no-virus td { background: #fafafa; }
  tr.row-empty .virus, tr.row-no-virus .virus { opacity: 0.6; }
  #loading, #error {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  #error {
    color: #a01818;
    background: #fde0e0;
    border-radius: 6px;
    margin: 20px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    text-align: left;
    padding: 20px;
    white-space: pre-wrap;
  }
  footer {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
  }
  footer a { color: var(--muted); }
  @media (max-width: 760px) {
    header { padding: 12px 14px; }
    main { padding: 12px 14px 40px; }
    .virus { max-width: 200px; font-size: 11px; }
    th { font-size: 10px; }
    td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="row1">
    <h1>McGinnis Lab AAV Stocks</h1>
    <span class="pill">Internal</span>
    <span id="sync-status">loading…</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search construct, capsid, position, notes…" autofocus>
    <select id="loc-filter"><option value="">All locations</option></select>
    <select id="status-filter">
      <option value="">All statuses</option>
      <option value="available">Available</option>
      <option value="empty">Empty</option>
      <option value="no virus">No virus</option>
    </select>
    <span id="count"></span>
  </div>
</header>
<main>
  <div id="loading">Fetching inventory from Airtable…</div>
  <div id="error" style="display:none"></div>
  <div id="content"></div>
</main>
<footer>
  <a href="https://mcginnislab.org">mcginnislab.org</a>
  &nbsp;·&nbsp;
  <a href="https://data.mcginnislab.org">data.mcginnislab.org</a>
  &nbsp;·&nbsp;
  <a href="https://protocols.mcginnislab.org">protocols.mcginnislab.org</a>
</footer>
<script>
// --- CONFIG --- replace AIRTABLE_PAT with your read-only token ---
const CONFIG = {
  baseId:   'appfINZ7timRX5B6c',
  tableId:  'tblGbgNKxxWkrLSTl',
  viewId:   'viwSK52HzUm2XkYg6',
  pat:      'patEncCWneaDOU37F.e3069e26f5d8887fde55ae80570141c25b5f07876c1a79fffb28602f944318aa',
};

// --- Titer parser (fallback: parses the raw 'Viral titer (GC/ml)' field if split fields aren't populated yet) ---
const TITER_RE  = /(\d+(?:\.\d+)?[eE][+\-]?\d+)/g;
const VOLUME_RE = /(\d+)\s*ul/gi;
const MARKER_RE = /(thick|thin|fine)\s+(red|blue|green|black|orange|purple|yellow)\s*(?:line)?/i;
const DATE_RE   = /(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})/g;

function parseTiter(raw) {
  const out = { status: 'available', titer_1: null, volume_1: null, titer_2: null, volume_2: null, marker_2: null, marker_2_date: null, raw: (raw||'').trim() };
  if (!raw || !raw.trim()) { out.status = 'unknown'; return out; }
  const low = raw.toLowerCase();
  const titers = Array.from(raw.matchAll(TITER_RE), m => parseFloat(m[1]));
  if (low.includes('no virus')) out.status = 'no virus';
  else if ((/\bempty\b/.test(low)) && titers.length === 0) out.status = 'empty';
  if (titers.length) {
    out.titer_1 = titers[0];
    if (titers.length >= 2) out.titer_2 = titers[1];
  }
  const vols = Array.from(raw.matchAll(VOLUME_RE), m => parseInt(m[1]));
  if (vols.length) {
    out.volume_1 = vols[0];
    out.volume_2 = vols[1] ?? (out.titer_2 !== null ? vols[0] : null);
  }
  const m = raw.match(MARKER_RE);
  if (m) out.marker_2 = `${m[1].toLowerCase()} ${m[2].toLowerCase()} line`;
  const dates = Array.from(raw.matchAll(DATE_RE), m => m[1]);
  if (dates.length && out.marker_2) out.marker_2_date = normDate(dates[dates.length - 1]);
  return out;
}

function normDate(d) {
  const sep = d.includes('-') ? '-' : '/';
  const [m, day, y] = d.split(sep);
  const yr = y.length === 2 ? '20' + y : y;
  const mm = String(parseInt(m)).padStart(2, '0');
  const dd = String(parseInt(day)).padStart(2, '0');
  return `${yr}-${mm}-${dd}`;
}

function fmtTiter(t) {
  if (t === null || t === undefined) return '—';
  // 4.12e12 → "4.12×10¹²"
  const [m, e] = t.toExponential(2).split('e');
  const exp = parseInt(e);
  const sups = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup = String(exp).split('').map(c => sups[c] || c).join('');
  return `${parseFloat(m)}×10${sup}`;
}

function markerClass(marker) {
  if (!marker) return '';
  const c = marker.match(/red|blue|green|black|orange|purple|yellow/i);
  return c ? c[0].toLowerCase() : 'generic';
}

// --- Fetch all records from Airtable (paginated) ---
async function fetchAll() {
  const base = `https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.tableId}`;
  const headers = { Authorization: `Bearer ${CONFIG.pat}` };
  let records = [];
  let url = `${base}?pageSize=100${CONFIG.viewId ? `&view=${CONFIG.viewId}` : ''}`;
  while (url) {
    const res = await fetch(url, { headers });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`Airtable ${res.status}: ${txt}`);
    }
    const data = await res.json();
    records = records.concat(data.records);
    url = data.offset ? `${base}?pageSize=100${CONFIG.viewId ? `&view=${CONFIG.viewId}` : ''}&offset=${data.offset}` : null;
  }
  return records;
}

// --- Normalize a record to a display row (prefer split fields if present, else parse raw) ---
function toRow(rec) {
  const f = rec.fields;
  // Skip empty-slot records (no virus genome)
  if (!f['Virus Genome']) return null;
  const location = (f['Location'] || '').trim();
  const tube = (f['Tube'] || '').trim();
  const virus = (f['Virus Genome'] || '').trim();
  const capsid = (f['Capsid'] || '').trim();
  const deposit = f['Deposit'] || '';

  // Prefer split fields; fall back to in-browser parse of raw
  let batch = {};
  const hasSplit = f['Status'] !== undefined || f['Titer 1 (GC/mL)'] !== undefined;
  if (hasSplit) {
    batch = {
      status: f['Status'] || 'available',
      titer_1: f['Titer 1 (GC/mL)'] ?? null,
      volume_1: f['Volume 1 (uL)'] ?? null,
      titer_2: f['Titer 2 (GC/mL)'] ?? null,
      volume_2: f['Volume 2 (uL)'] ?? null,
      marker_2: f['Marker 2'] ?? null,
      marker_2_date: f['Marker 2 date'] ?? null,
      raw: f['Raw titer notes'] ?? f['Viral titer (GC/ml)'] ?? '',
    };
  } else {
    batch = parseTiter(f['Viral titer (GC/ml)'] || '');
  }

  return {
    id: rec.id,
    location, tube, virus, capsid, deposit,
    ...batch,
    search: [location, tube, virus, capsid, batch.raw].join(' ').toLowerCase(),
  };
}

// --- Rendering ---
let ALL = [];
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const locFilter = document.getElementById('loc-filter').value;
  const statFilter = document.getElementById('status-filter').value;
  const filtered = ALL.filter(r => {
    if (locFilter && r.location !== locFilter) return false;
    if (statFilter && r.status !== statFilter) return false;
    if (q && !r.search.includes(q)) return false;
    return true;
  });
  document.getElementById('count').textContent = `${filtered.length} / ${ALL.length}`;

  // Group by location
  const groups = {};
  for (const r of filtered) {
    (groups[r.location] = groups[r.location] || []).push(r);
  }
  const sortedLocs = Object.keys(groups).sort();

  const content = document.getElementById('content');
  if (filtered.length === 0) {
    content.innerHTML = '<p style="color:var(--muted); padding:40px; text-align:center;">No stocks match your filter.</p>';
    return;
  }

  let html = '';
  for (const loc of sortedLocs) {
    const items = groups[loc].sort((a, b) => a.tube.localeCompare(b.tube, undefined, { numeric: true }));
    html += `<section class="location-group"><h2>${esc(loc)} <span class="count">(${items.length})</span></h2>`;
    html += `<table><thead><tr>
      <th>Pos</th>
      <th>Construct</th>
      <th>Capsid</th>
      <th>Batch 1</th>
      <th>Batch 2</th>
      <th>Status</th>
      <th>Deposited</th>
      <th></th>
    </tr></thead><tbody>`;
    for (const r of items) {
      const rowCls = r.status === 'empty' ? 'row-empty' : (r.status === 'no virus' ? 'row-no-virus' : '');
      html += `<tr class="${rowCls}">
        <td class="pos">${esc(r.tube)}</td>
        <td class="virus">${esc(r.virus)}</td>
        <td>${r.capsid ? `<span class="capsid">${esc(r.capsid)}</span>` : ''}</td>
        <td class="batch">${renderBatch(r.titer_1, r.volume_1)}</td>
        <td class="batch">${renderBatch(r.titer_2, r.volume_2, r.marker_2, r.marker_2_date)}</td>
        <td><span class="status ${r.status.replace(' ', '-')}">${esc(r.status)}</span></td>
        <td class="deposit">${esc(r.deposit || '')}</td>
        <td><a class="edit-link" href="https://airtable.com/${CONFIG.baseId}/${CONFIG.tableId}/${r.id}" target="_blank" rel="noopener">edit ↗</a></td>
      </tr>`;
    }
    html += `</tbody></table></section>`;
  }
  content.innerHTML = html;
}

function renderBatch(titer, vol, marker, date) {
  if (titer === null || titer === undefined) return '<span style="color:var(--soft)">—</span>';
  let out = `<span class="titer">${fmtTiter(titer)}</span>`;
  if (vol) out += ` <span class="vol">· ${vol}µL</span>`;
  if (marker) out += `<br><span class="marker ${markerClass(marker)}">${esc(marker)}</span>`;
  if (date) out += ` <span class="vol" style="font-size:10px">${esc(date)}</span>`;
  return out;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Init ---
async function init() {
  if (!CONFIG.pat || CONFIG.pat.startsWith('REPLACE')) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Airtable PAT not set. Edit index.html → CONFIG.pat to a read-only token for base ' + CONFIG.baseId + ', then redeploy.';
    return;
  }
  try {
    const records = await fetchAll();
    ALL = records.map(toRow).filter(Boolean);

    // Populate location filter
    const locs = Array.from(new Set(ALL.map(r => r.location).filter(Boolean))).sort();
    const sel = document.getElementById('loc-filter');
    for (const l of locs) sel.add(new Option(l, l));

    document.getElementById('loading').style.display = 'none';
    document.getElementById('sync-status').textContent = `${ALL.length} stocks · synced ${new Date().toLocaleTimeString()}`;

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('loc-filter').addEventListener('change', render);
    document.getElementById('status-filter').addEventListener('change', render);
    render();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Failed to load inventory.\n\n' + e.message;
  }
}
init();
</script>
</body>
</html>
