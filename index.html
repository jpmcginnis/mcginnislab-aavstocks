<style>

    --fg: #1b1b1b;
    --muted: #6b6b6b;
    --soft: #9a9a9a;
    --bg: #ffffff;

    --warn-bg: #fff3cd;
    --warn-fg: #664d03;

    --dim-fg: #777;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {

  header {

<script>
// --- CONFIG --- replace AIRTABLE_PAT with your read-only token ---
const CONFIG = {
  baseId:   'appfINZ7timRX5B6c',
  tableId:  'tblGbgNKxxWkrLSTl',
  viewId:   'viwSK52HzUm2XkYg6',
  pat:      'patEncCWneaDOU37F.e3069e26f5d8887fde55ae80570141c25b5f07876c1a79fffb28602f944318aa',
  trackerLocationsCsv: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT89SnFMc1367o-tWgqtNIuxw8qfcYR5wkCe0TPiFItHZLTZWtiQC6wgUaVaPF3vpv3qGyiXwqLuzeV/pub?gid=1368733165&single=true&output=csv',
  trackerTitersCsv:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vT89SnFMc1367o-tWgqtNIuxw8qfcYR5wkCe0TPiFItHZLTZWtiQC6wgUaVaPF3vpv3qGyiXwqLuzeV/pub?gid=754291894&single=true&output=csv',
};

// --- Titer parser (fallback: parses the raw 'Viral titer (GC/ml)' field if split fields aren't populated yet) ---
const TITER_RE  = /(\d+(?:\.\d+)?[eE][+\-]?\d+)/g;
const VOLUME_RE = /(\d+)\s*ul/gi;
const MARKER_RE = /(thick|thin|fine)\s+(red|blue|green|black|orange|purple|yellow)\s*(?:line)?/i;
const DATE_RE   = /(\d{1,2}[-/]\d{1,2}[-/]\d{2,4})/g;

function parseTiter(raw) {
  const out = { status: 'available', titer_1: null, volume_1: null, titer_2: null, volume_2: null, marker_2: null, marker_2_date: null, raw: (raw||'').trim() };
  if (!raw || !raw.trim()) { out.status = 'unknown'; return out; }
  const low = raw.toLowerCase();
  const titers = Array.from(raw.matchAll(TITER_RE), m => parseFloat(m[1]));
  if (low.includes('no virus')) out.status = 'no virus';
  else if ((/\bempty\b/.test(low)) && titers.length === 0) out.status = 'empty';
  if (titers.length) {
    out.titer_1 = titers[0];
    if (titers.length >= 2) out.titer_2 = titers[1];
  }
  const vols = Array.from(raw.matchAll(VOLUME_RE), m => parseInt(m[1]));
  if (vols.length) {
    out.volume_1 = vols[0];
    out.volume_2 = vols[1] ?? (out.titer_2 !== null ? vols[0] : null);
  }
  const m = raw.match(MARKER_RE);
  if (m) out.marker_2 = `${m[1].toLowerCase()} ${m[2].toLowerCase()} line`;
  const dates = Array.from(raw.matchAll(DATE_RE), m => m[1]);
  if (dates.length && out.marker_2) out.marker_2_date = normDate(dates[dates.length - 1]);
  return out;
}

function normDate(d) {
  const sep = d.includes('-') ? '-' : '/';
  const [m, day, y] = d.split(sep);
  const yr = y.length === 2 ? '20' + y : y;
  const mm = String(parseInt(m)).padStart(2, '0');
  const dd = String(parseInt(day)).padStart(2, '0');
  return `${yr}-${mm}-${dd}`;
}

function fmtTiter(t) {
  if (t === null || t === undefined) return '—';
  // 4.12e12 → "4.12×10¹²"
  const [m, e] = t.toExponential(2).split('e');
  const exp = parseInt(e);
  const sups = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  const sup = String(exp).split('').map(c => sups[c] || c).join('');
  return `${parseFloat(m)}×10${sup}`;
}

function markerClass(marker) {
  if (!marker) return '';
  const c = marker.match(/red|blue|green|black|orange|purple|yellow/i);
  return c ? c[0].toLowerCase() : 'generic';
}

// --- Tracker (Google Sheets) parsing ---
function parseCsv(txt) {
  // Minimal RFC4180 parser (handles quoted fields with commas/newlines/escaped quotes)
  const rows = [[]];
  let field = '', inQ = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (inQ) {
      if (c === '"' && txt[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { rows[rows.length - 1].push(field); field = ''; }
      else if (c === '\r') {}
      else if (c === '\n') { rows[rows.length - 1].push(field); field = ''; rows.push([]); }
      else field += c;
    }
  }
  rows[rows.length - 1].push(field);
  if (rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  const header = rows.shift().map(h => (h || '').replace(/^﻿/, '').trim());
  return rows.map(r => Object.fromEntries(header.map((h, i) => [h, r[i] ?? ''])));
}

function parseTrackerLoc(s) {
  // Return {location, tube} to match Airtable Location+Tube, or null if unparseable.
  s = (s || '').trim();
  if (!s || /^not aliquoted$/i.test(s)) return null;
  // NC-X## e.g. NC-D2, NC-O10, NC-P15
  let m = s.match(/^(NC-[A-Z])(\d+)$/i);
  if (m) {
    const letter = m[1].split('-')[1].toUpperCase();
    return { location: `NC-${letter}`, tube: `${letter}${m[2]}` };
  }
  // JP-NC# with optional space/hyphen variants: JP-1C3, JP1-B3, JP-1 B4, JP-2A1
  m = s.match(/^JP[-\s]*(\d+)[-\s]*([A-Z])\s*(\d+)$/i);
  if (m) return { location: `JP-BOX${m[1]}`, tube: `${m[2].toUpperCase()}${m[3]}` };
  return null;
}

function toTrackerBundle(locationsRows, titersRows) {
  // Index titers by virus+library
  const titerByKey = {};
  for (const r of titersRows) {
    const key = `${(r['Virus'] || '').trim()}|${(r['Library'] || '').trim()}`;
    titerByKey[key] = {
      vg_mL:    parseFloat(r['Titer (vg/mL)']) || null,
      vg_uL:    parseFloat(r['Titer (vg/µL)']) || null,
      date:     (r['Date titer updated'] || '').trim() || null,
      notes:    (r['Notes'] || '').trim() || null,
    };
  }
  // Build location-keyed index of tracker rows (joinable against Airtable)
  const byAirtableLoc = {};
  const unmatched = [];
  for (const r of locationsRows) {
    const rawLoc = (r['-80 location'] || '').trim();
    const parsed = parseTrackerLoc(rawLoc);
    const virus = (r['Virus'] || '').trim();
    const library = (r['Library'] || '').trim();
    const titer = titerByKey[`${virus}|${library}`] || {};
    const entry = {
      tracker_raw_loc: rawLoc,
      tracker_virus: virus,
      tracker_library: library,
      tracker_variant: (r['Variant Sequence'] || '').trim() || null,
      tubes_remaining: r['Stock tubes remaining'] === '' ? null : (parseFloat(r['Stock tubes remaining']) || 0),
      minis_remaining: r['Minis remaining'] === '' ? null : (parseFloat(r['Minis remaining']) || 0),
      action: (r['Action needed'] || '').trim() || null,
      tracker_titer_mL: titer.vg_mL ?? null,
      tracker_titer_uL: titer.vg_uL ?? null,
      tracker_titer_date: titer.date,
      tracker_titer_notes: titer.notes,
    };
    if (parsed) {
      byAirtableLoc[`${parsed.location}|${parsed.tube}`] = entry;
    } else {
      unmatched.push(entry);
    }
  }
  return { byAirtableLoc, unmatched };
}

function actionBadgeClass(action) {
  if (!action) return 'generic';
  const a = action.toLowerCase();
  if (a === 'ok') return 'ok';
  if (a.includes('make more') || a.includes('reorder') || a.includes('order')) return 'red';
  if (a.includes('thaw') || a.includes('make') || a.includes('aliquot')) return 'yellow';
  return 'generic';
}

// --- Fetch all records from Airtable (paginated) ---
async function fetchAll() {
  const base = `https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.tableId}`;
  const headers = { Authorization: `Bearer ${CONFIG.pat}` };
  let records = [];
  let url = `${base}?pageSize=100${CONFIG.viewId ? `&view=${CONFIG.viewId}` : ''}`;
  while (url) {
    const res = await fetch(url, { headers });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(`Airtable ${res.status}: ${txt}`);
    }
    const data = await res.json();
    records = records.concat(data.records);
    url = data.offset ? `${base}?pageSize=100${CONFIG.viewId ? `&view=${CONFIG.viewId}` : ''}&offset=${data.offset}` : null;
  }
  return records;
}

// --- Normalize a record to a display row (prefer split fields if present, else parse raw) ---
function toRow(rec) {
  const f = rec.fields;
  // Skip empty-slot records (no virus genome)
  if (!f['Virus Genome']) return null;
  const location = (f['Location'] || '').trim();
  const tube = (f['Tube'] || '').trim();
  const virus = (f['Virus Genome'] || '').trim();
  const capsid = (f['Capsid'] || '').trim();
  const deposit = f['Deposit'] || '';

  // Prefer split fields; fall back to in-browser parse of raw
  let batch = {};
  const hasSplit = f['Status'] !== undefined || f['Titer 1 (GC/mL)'] !== undefined;
  if (hasSplit) {
    batch = {
      status: f['Status'] || 'available',
      titer_1: f['Titer 1 (GC/mL)'] ?? null,
      volume_1: f['Volume 1 (uL)'] ?? null,
      titer_2: f['Titer 2 (GC/mL)'] ?? null,
      volume_2: f['Volume 2 (uL)'] ?? null,
      marker_2: f['Marker 2'] ?? null,
      marker_2_date: f['Marker 2 date'] ?? null,
      raw: f['Raw titer notes'] ?? f['Viral titer (GC/ml)'] ?? '',
    };
  } else {
    batch = parseTiter(f['Viral titer (GC/ml)'] || '');
  }

  // Join tracker data by Location+Tube
  const trackerKey = `${location}|${tube}`;
  const tracker = (TRACKER_BY_LOC && TRACKER_BY_LOC[trackerKey]) || {};

  return {
    id: rec.id,
    location, tube, virus, capsid, deposit,
    ...batch,
    tubes_remaining:   tracker.tubes_remaining ?? null,
    minis_remaining:   tracker.minis_remaining ?? null,
    action:            tracker.action ?? null,
    tracker_titer_mL:  tracker.tracker_titer_mL ?? null,
    tracker_titer_date:tracker.tracker_titer_date ?? null,
    tracker_virus:     tracker.tracker_virus ?? null,
    tracker_library:   tracker.tracker_library ?? null,
    has_tracker:       !!tracker.tracker_virus,
    search: [
      location, tube, virus, capsid, batch.raw,
      tracker.tracker_virus, tracker.tracker_library, tracker.action,
    ].filter(Boolean).join(' ').toLowerCase(),
  };
}

// --- Rendering ---
let ALL = [];
let TRACKER_BY_LOC = {};         // keyed Location|Tube → tracker entry
let TRACKER_UNMATCHED = [];      // tracker rows that couldn't resolve to an Airtable row
const SORT = { col: 'location', dir: 'asc' };  // default: group-like, sorted by location+pos

const COLS = [
  { key: 'location',         label: 'Location' },
  { key: 'tube',             label: 'Pos' },
  { key: 'virus',            label: 'Construct' },
  { key: 'capsid',           label: 'Capsid' },
  { key: 'tubes_remaining',  label: 'Stock' },
  { key: 'minis_remaining',  label: 'Minis' },
  { key: 'action',           label: 'Action' },
  { key: 'tracker_titer_mL', label: 'Tracker titer' },
  { key: 'titer_1',          label: 'Batch 1' },
  { key: 'titer_2',          label: 'Batch 2' },
  { key: 'status',           label: 'Status' },
  { key: 'deposit',          label: 'Deposited' },
];

function naturalPos(s) {
  const m = String(s || '').match(/^([A-Za-z]*)(\d+)/);
  return m ? [m[1], parseInt(m[2])] : [String(s || ''), 0];
}

const NUMERIC_COLS = new Set(['titer_1', 'titer_2', 'tracker_titer_mL', 'tubes_remaining', 'minis_remaining']);

function cmp(a, b, col, dir) {
  let av = a[col], bv = b[col];
  let c;
  if (col === 'tube') {
    const [al, an] = naturalPos(av);
    const [bl, bn] = naturalPos(bv);
    c = al.localeCompare(bl) || (an - bn);
  } else if (NUMERIC_COLS.has(col)) {
    // nulls last regardless of direction
    if (av == null && bv == null) c = 0;
    else if (av == null) return 1;
    else if (bv == null) return -1;
    else c = av - bv;
  } else if (col === 'deposit') {
    const ad = av ? new Date(av).getTime() : 0;
    const bd = bv ? new Date(bv).getTime() : 0;
    if (!ad && !bd) c = 0;
    else if (!ad) return 1;
    else if (!bd) return -1;
    else c = ad - bd;
  } else {
    av = String(av || ''); bv = String(bv || '');
    c = av.localeCompare(bv);
  }
  return dir === 'asc' ? c : -c;
}

function multiSort(rows) {
  // Primary = SORT col/dir. Tiebreak = Location asc, then Pos asc (so default feels grouped).
  return rows.sort((a, b) => (
    cmp(a, b, SORT.col, SORT.dir) ||
    (SORT.col !== 'location' ? cmp(a, b, 'location', 'asc') : 0) ||
    (SORT.col !== 'tube'     ? cmp(a, b, 'tube', 'asc')     : 0)
  ));
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const locFilter = document.getElementById('loc-filter').value;
  const statFilter = document.getElementById('status-filter').value;
  const filtered = ALL.filter(r => {
    if (locFilter && r.location !== locFilter) return false;
    if (statFilter && r.status !== statFilter) return false;
    if (q && !r.search.includes(q)) return false;
    return true;
  });
  document.getElementById('count').textContent = `${filtered.length} / ${ALL.length}`;

  const content = document.getElementById('content');
  if (filtered.length === 0) {
    content.innerHTML = '<p style="color:var(--muted); padding:40px; text-align:center;">No stocks match your filter.</p>';
    return;
  }

  multiSort(filtered);

  // Header row with sort indicators
  const headerHtml = COLS.map(c => {
    let cls = 'sortable';
    if (SORT.col === c.key) cls = SORT.dir === 'asc' ? 'sort-asc' : 'sort-desc';
    return `<th class="${cls}" data-col="${c.key}">${esc(c.label)}</th>`;
  }).join('') + '<th></th>';

  // Body rows
  let lastLoc = null;
  const bodyHtml = filtered.map(r => {
    const rowCls = [];
    if (r.status === 'empty') rowCls.push('row-empty');
    else if (r.status === 'no virus') rowCls.push('row-no-virus');
    // Add a thin border between consecutive different locations (visual grouping)
    if (SORT.col === 'location' && r.location !== lastLoc) rowCls.push('loc-boundary');
    lastLoc = r.location;
    return `<tr class="${rowCls.join(' ')}">
      <td class="pos">${esc(r.location)}</td>
      <td class="pos">${esc(r.tube)}</td>
      <td class="virus">${esc(r.virus)}</td>
      <td>${r.capsid ? `<span class="capsid">${esc(r.capsid)}</span>` : ''}</td>
      <td class="num">${renderCount(r.tubes_remaining)}</td>
      <td class="num">${renderCount(r.minis_remaining)}</td>
      <td>${renderAction(r.action)}</td>
      <td class="batch">${renderTrackerTiter(r.tracker_titer_mL, r.tracker_titer_date)}</td>
      <td class="batch">${renderBatch(r.titer_1, r.volume_1)}</td>
      <td class="batch">${renderBatch(r.titer_2, r.volume_2, r.marker_2, r.marker_2_date)}</td>
      <td><span class="status ${r.status.replace(' ', '-')}">${esc(r.status)}</span></td>
      <td class="deposit">${esc(r.deposit || '')}</td>
      <td><a class="edit-link" href="https://airtable.com/${CONFIG.baseId}/${CONFIG.tableId}/${r.id}" target="_blank" rel="noopener">edit ↗</a></td>
    </tr>`;
  }).join('');

  // Tracker-only section (rows that didn't resolve to an Airtable location)
  let unmatchedHtml = '';
  if (TRACKER_UNMATCHED.length) {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const umFiltered = q
      ? TRACKER_UNMATCHED.filter(t => [t.tracker_virus, t.tracker_library, t.tracker_raw_loc, t.action].filter(Boolean).join(' ').toLowerCase().includes(q))
      : TRACKER_UNMATCHED;
    if (umFiltered.length) {
      unmatchedHtml = `
      <h2 class="section-title">Tracker-only — location not in Airtable catalog <span class="section-count">(${umFiltered.length})</span></h2>
      <table><thead><tr>
        <th>Tracker loc</th><th>Virus</th><th>Library</th>
        <th>Stock</th><th>Minis</th><th>Action</th><th>Tracker titer</th>
      </tr></thead><tbody>
      ${umFiltered.map(t => `<tr class="tracker-only">
        <td class="pos">${esc(t.tracker_raw_loc)}</td>
        <td class="virus">${esc(t.tracker_virus)}</td>
        <td>${esc(t.tracker_library)}</td>
        <td class="num">${renderCount(t.tubes_remaining)}</td>
        <td class="num">${renderCount(t.minis_remaining)}</td>
        <td>${renderAction(t.action)}</td>
        <td class="batch">${renderTrackerTiter(t.tracker_titer_mL, t.tracker_titer_date)}</td>
      </tr>`).join('')}
      </tbody></table>`;
    }
  }

  content.innerHTML = `<table><thead><tr>${headerHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>${unmatchedHtml}`;

  // Wire sort clicks
  content.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (SORT.col === col) {
        SORT.dir = SORT.dir === 'asc' ? 'desc' : 'asc';
      } else {
        SORT.col = col;
        SORT.dir = 'asc';
      }
      render();
    });
  });
}

function renderBatch(titer, vol, marker, date) {
  if (titer === null || titer === undefined) return '<span style="color:var(--soft)">—</span>';
  let out = `<span class="titer">${fmtTiter(titer)}</span>`;
  if (vol) out += ` <span class="vol">· ${vol}µL</span>`;
  if (marker) out += `<br><span class="marker ${markerClass(marker)}">${esc(marker)}</span>`;
  if (date) out += ` <span class="vol" style="font-size:10px">${esc(date)}</span>`;
  return out;
}

function renderTrackerTiter(titer_mL, date) {
  if (titer_mL === null || titer_mL === undefined) return '<span style="color:var(--soft)">—</span>';
  let out = `<span class="titer tracker-titer">${fmtTiter(titer_mL)}</span>`;
  if (date) out += `<br><span class="vol" style="font-size:10px">updated ${esc(date)}</span>`;
  return out;
}

function renderCount(n) {
  if (n === null || n === undefined) return '<span style="color:var(--soft)">—</span>';
  const cls = n === 0 ? 'count-zero' : (n <= 3 ? 'count-low' : 'count-ok');
  return `<span class="count ${cls}">${n}</span>`;
}

function renderAction(action) {
  if (!action) return '<span style="color:var(--soft)">—</span>';
  const cls = actionBadgeClass(action);
  return `<span class="action-badge ${cls}">${esc(action)}</span>`;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Init ---
async function init() {
  if (!CONFIG.pat || CONFIG.pat.startsWith('REPLACE')) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Airtable PAT not set. Edit index.html → CONFIG.pat to a read-only token for base ' + CONFIG.baseId + ', then redeploy.';
    return;
  }
  try {
    // Fetch Airtable + tracker CSVs in parallel
    const [records, trackerLocCsv, trackerTiterCsv] = await Promise.all([
      fetchAll(),
      fetch(CONFIG.trackerLocationsCsv).then(r => r.ok ? r.text() : Promise.reject(new Error(`Tracker Locations ${r.status}`))),
      fetch(CONFIG.trackerTitersCsv).then(r => r.ok ? r.text() : Promise.reject(new Error(`Tracker Titers ${r.status}`))),
    ]);

    const trackerLocRows = parseCsv(trackerLocCsv);
    const trackerTiterRows = parseCsv(trackerTiterCsv);
    const { byAirtableLoc, unmatched } = toTrackerBundle(trackerLocRows, trackerTiterRows);
    TRACKER_BY_LOC = byAirtableLoc;
    TRACKER_UNMATCHED = unmatched;

    ALL = records.map(toRow).filter(Boolean);

    // Populate location filter
    const locs = Array.from(new Set(ALL.map(r => r.location).filter(Boolean))).sort();
    const sel = document.getElementById('loc-filter');
    for (const l of locs) sel.add(new Option(l, l));

    document.getElementById('loading').style.display = 'none';
    const trackedCount = ALL.filter(r => r.has_tracker).length;
    document.getElementById('sync-status').textContent =
      `${ALL.length} stocks · ${trackedCount} tracked · synced ${new Date().toLocaleTimeString()}`;

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('loc-filter').addEventListener('change', render);
    document.getElementById('status-filter').addEventListener('change', render);
    render();

    // Measure header height for sticky table-header offset; re-measure on resize.
    const setHeaderOffset = () => {
      const h = document.querySelector('header').offsetHeight;
      document.documentElement.style.setProperty('--header-h', h + 'px');
    };
    setHeaderOffset();
    window.addEventListener('resize', setHeaderOffset);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = 'Failed to load inventory.\n\n' + e.message;
  }
}
init();
</script>
</body>
</html>
